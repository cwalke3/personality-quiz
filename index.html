<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personality Quiz</title>
    <link rel="icon" type="image/x-icon" href="/img/ideas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href ="./css/style.css">
</head>
<body>
    <h1 class="text-center mt-4">What Type of Person Are You?</h1>
    
    <!-- Start quiz element -->
    <div class="container d-flex justify-content-center" id="question-1">
      <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">What do you enjoy doing on the weekend?</h4>
        <div class="row g-2">
          <div class="col-6">
            <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Exploring new places</button>
            </div>
            <div class="col-6">
              <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Drawing or creating something</button>
            </div>
            <div class="col-6">
              <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Relaxing at home</button>
            </div>
            <div class="col-6">
              <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">Trying something exciting</button>
          </div>
        </div>
      </div>
    </div>

    
    
    <!-- End quiz element -->

    <!-- Add more quiz elements here -->
<div class="container d-flex justify-content-center" id="question-2">
    <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">What sounds like your perfect vacation?</h4>
        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Hiking through the mountains</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Visiting art museums</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Relaxing on the beach</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">Going to an amusement park</button>
            </div>
        </div>
    </div>
</div>
<div class="container d-flex justify-content-center" id="question-3">
    <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">How would your friends describe you?</h4>
        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Adventurous and outgoing</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Creative and imaginative</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Calm and relaxed</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">Energetic and spontaneous</button>
            </div>
        </div>
    </div>
</div>
<div class="container d-flex justify-content-center" id="question-4">
    <div class="card my-4 p-4 question-block" style="width: 75%;">
        <h4 class="mb-3">What would you rather do in your free time?</h4>
        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="A">Go on a road trip</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="B">Take pictures or make art</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="C">Watch movies and relax</button>
            </div>
            <div class="col-6">
                <button class="btn btn-outline-primary w-100 answer-btn" data-answer="D">Try a new activity</button>
            </div>
        </div>
    </div>
</div>
    <div class="container d-flex justify-content-center">
      <button id="show-result" class="btn btn-success my-4">Show Results</button>
    </div>    
    <!-- Output the result here -->
    <div class="container d-flex justify-content-center">
      <div id="result-container" class="card p-4 mb-4" style="width: 75%; display: none;">
        <h3>Your Result:</h3>
        <p id="result-text"></p>
      </div>
    </div>
    
    <!-- Connect to your script file here -->
     <script src = "./js/script.js"></script>
</body>
</html>
